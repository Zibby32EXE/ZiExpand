[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ziexpand"
version = "0.2.0"
description = "ZiExpand - Easy Hacknet Extension building tool with CLI and GUI"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Zibby32EXE"}
]
keywords = ["hacknet", "extension", "modding", "cli", "gui", "xml", "game"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.scripts]
ziexpand = "ziexpand.cli:main"

[project.urls]
Homepage = "https://github.com/Zibby32EXE/ZiExpand"
Repository = "https://github.com/Zibby32EXE/ZiExpand"
Issues = "https://github.com/Zibby32EXE/ZiExpand/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ziexpand*"]
